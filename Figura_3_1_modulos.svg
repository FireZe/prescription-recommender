<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker></defs>
<text x="590" y="34" font-family="Georgia,serif" font-size="15" font-weight="bold" text-anchor="middle">Principais módulos do sistema de recomendação proposto</text>
<rect x="20" y="70" width="155" height="183" rx="4" fill="#ececec" stroke="#888" stroke-width="1"/><text x="97.5" y="86" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Preparação de Dados e</text><text x="97.5" y="99" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Base de Conhecimento</text><text x="28" y="118" font-family="Georgia,serif" font-size="8.6">• Dados do MIMIC-IV</text><text x="28" y="131" font-family="Georgia,serif" font-size="8.6">• Perfis sintéticos</text><text x="28" y="144" font-family="Georgia,serif" font-size="8.6">  (Synthea)</text><text x="28" y="157" font-family="Georgia,serif" font-size="8.6">• Exemplos de treino</text><text x="28" y="170" font-family="Georgia,serif" font-size="8.6">  (feedback implícito)</text><text x="28" y="183" font-family="Georgia,serif" font-size="8.6">• Normalização de fármacos</text><text x="28" y="196" font-family="Georgia,serif" font-size="8.6">• Base de conhecimento</text><text x="28" y="209" font-family="Georgia,serif" font-size="8.6">  (fármacos, classes,</text><text x="28" y="222" font-family="Georgia,serif" font-size="8.6">  regras)</text>
<rect x="210" y="300" width="155" height="113" rx="4" fill="#ececec" stroke="#888" stroke-width="1"/><text x="287.5" y="316" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Contexto do Utente</text><text x="218" y="335" font-family="Georgia,serif" font-size="8.6">• Perfil clínico (idade,</text><text x="218" y="348" font-family="Georgia,serif" font-size="8.6">  função renal, condições,</text><text x="218" y="361" font-family="Georgia,serif" font-size="8.6">  alergias)</text><text x="218" y="374" font-family="Georgia,serif" font-size="8.6">• Medicação ativa</text><text x="218" y="387" font-family="Georgia,serif" font-size="8.6">• Prescrição a avaliar</text>
<rect x="400" y="70" width="155" height="248" rx="4" fill="#fdf3d0" stroke="#b8860b" stroke-width="2.2"/><text x="477.5" y="86" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Pipeline de Recomendação com</text><text x="477.5" y="99" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Segurança em Primeiro Lugar</text><text x="408" y="118" font-family="Georgia,serif" font-size="8.6">• Motor de segurança e</text><text x="408" y="131" font-family="Georgia,serif" font-size="8.6">  regras</text><text x="408" y="144" font-family="Georgia,serif" font-size="8.6">• Deteção de alertas</text><text x="408" y="157" font-family="Georgia,serif" font-size="8.6">  (interação,</text><text x="408" y="170" font-family="Georgia,serif" font-size="8.6">  contraindicação,</text><text x="408" y="183" font-family="Georgia,serif" font-size="8.6">  duplicação, alergia,</text><text x="408" y="196" font-family="Georgia,serif" font-size="8.6">  renal/QT)</text><text x="408" y="209" font-family="Georgia,serif" font-size="8.6">• Geração de candidatos</text><text x="408" y="222" font-family="Georgia,serif" font-size="8.6">  admissíveis</text><text x="408" y="235" font-family="Georgia,serif" font-size="8.6">• Ordenação heurística</text><text x="408" y="248" font-family="Georgia,serif" font-size="8.6">  determinística</text><text x="408" y="261" font-family="Georgia,serif" font-size="8.6">• Reordenação por ML</text><text x="408" y="274" font-family="Georgia,serif" font-size="8.6">  limitada (classificador</text><text x="408" y="287" font-family="Georgia,serif" font-size="8.6">  + LTR + meta-learner)</text>
<rect x="620" y="70" width="155" height="152" rx="4" fill="#ececec" stroke="#888" stroke-width="1"/><text x="697.5" y="86" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Explicação e Auditoria</text><text x="628" y="105" font-family="Georgia,serif" font-size="8.6">• Explicação por LLM</text><text x="628" y="118" font-family="Georgia,serif" font-size="8.6">  (Qwen3) + fallback</text><text x="628" y="131" font-family="Georgia,serif" font-size="8.6">  determinístico</text><text x="628" y="144" font-family="Georgia,serif" font-size="8.6">• Rastreabilidade clínica</text><text x="628" y="157" font-family="Georgia,serif" font-size="8.6">• Testes de regressão e</text><text x="628" y="170" font-family="Georgia,serif" font-size="8.6">  cobertura</text><text x="628" y="183" font-family="Georgia,serif" font-size="8.6">• Validação externa</text><text x="628" y="196" font-family="Georgia,serif" font-size="8.6">  (DrugBank/TDC)</text>
<rect x="820" y="70" width="155" height="100" rx="4" fill="#ececec" stroke="#888" stroke-width="1"/><text x="897.5" y="86" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Runtime e Acesso via API</text><text x="828" y="105" font-family="Georgia,serif" font-size="8.6">• Orquestração dos pedidos</text><text x="828" y="118" font-family="Georgia,serif" font-size="8.6">• Backend FastAPI</text><text x="828" y="131" font-family="Georgia,serif" font-size="8.6">• Base de dados da</text><text x="828" y="144" font-family="Georgia,serif" font-size="8.6">  aplicação</text>
<rect x="1000" y="70" width="155" height="100" rx="4" fill="#ececec" stroke="#888" stroke-width="1"/><text x="1077.5" y="86" font-family="Georgia,serif" font-size="10.5" font-weight="bold" text-anchor="middle">Interface de Utilizador</text><text x="1008" y="105" font-family="Georgia,serif" font-size="8.6">• Interface do clínico</text><text x="1008" y="118" font-family="Georgia,serif" font-size="8.6">• Visualização de alertas</text><text x="1008" y="131" font-family="Georgia,serif" font-size="8.6">  e recomendações</text><text x="1008" y="144" font-family="Georgia,serif" font-size="8.6">• Painel de testes</text>
<path d="M175,161.5 L398,100" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M97.5,253 L287.5,298" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M365,356.5 L398,288" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M555,105 L618,105" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M775,105 L818,105" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M975,105 L998,105" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<path d="M400 340 h155 v84 h-155 z" fill="#fdf9e3" stroke="#b8860b" stroke-width="1" stroke-dasharray="4,3"/>
<path d="M477.5,318 L477.5,338" stroke="#444" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
<text x="406" y="356" font-family="Georgia,serif" font-size="8.6" font-style="italic">Módulo central: transforma o</text>
<text x="406" y="370" font-family="Georgia,serif" font-size="8.6" font-style="italic">contexto clínico do utente e a</text>
<text x="406" y="384" font-family="Georgia,serif" font-size="8.6" font-style="italic">prescrição num conjunto de alertas</text>
<text x="406" y="398" font-family="Georgia,serif" font-size="8.6" font-style="italic">de segurança e de alternativas</text>
<text x="406" y="412" font-family="Georgia,serif" font-size="8.6" font-style="italic">terapêuticas ordenadas.</text>
</svg>